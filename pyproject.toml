[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-swarm"
version = "1.1.0"
description = "局域网多机多 agent 协同调度器：拆分任务、独立工作区、差分合并、手机看板"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wangzi5151" }]
keywords = ["multi-agent", "lan", "termux", "aider", "ollama", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Build Tools",
]
# 运行时零第三方依赖
dependencies = []

[project.optional-dependencies]
# 只是开发工具，运行 Swarm 不需要
dev = []

[project.scripts]
swarm = "swarm.cli:main"

[project.urls]
Homepage = "https://github.com/wangzi5151/ai-swarm"
Issues = "https://github.com/wangzi5151/ai-swarm/issues"

[tool.setuptools]
packages = ["swarm"]
